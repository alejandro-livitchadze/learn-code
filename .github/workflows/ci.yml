name: CI
on:
  push:
  pull_request:
jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm lesson check content
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the host and both remotes (plus the duplicate-React variant of
      # remote_b), records runtime outputs, fails if they differ from
      # content/frontend-architecture/examples/recorded/outputs.json.
      - run: pnpm examples:check
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @learn-code/web build
      # Playwright < 1.60 hangs while extracting browsers on Node >= 24.16 and
      # Node 26 (yauzl stream bug, microsoft/playwright#40724). Run only the
      # install under Node 22; remove once Playwright is bumped to >= 1.60.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --filter @learn-code/web exec playwright install --with-deps chromium
        timeout-minutes: 5
        env:
          DEBUG: pw:install
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm --filter @learn-code/web e2e
